name: ayo-musica-tailscale
# "Máquina" própria na rede Tailscale só para a sincronização do Ayo Música: https://ayo-musica.<sua-tailnet>.ts.net
# Não mexe no tailscaled da máquina nem no Funnel dos outros serviços (modo userspace, estado próprio).
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: ayo-musica-tailscale
    hostname: ayo-musica
    network_mode: host          # enxerga o servidor em 127.0.0.1:3600
    env_file: .env              # TS_AUTHKEY=... (só você edita; nunca vai para o git)
    environment:
      - TS_HOSTNAME=ayo-musica
      - TS_USERSPACE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./estado:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped
