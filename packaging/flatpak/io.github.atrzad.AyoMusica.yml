# Flatpak do Ayo Música.  make flatpak-install  (usa o org.flatpak.Builder do Flathub)
id: io.github.atrzad.AyoMusica
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: ayo-musica
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  # Letras (LRCLIB), identificação de músicas (Deezer, MusicBrainz) e capas oficiais.
  - --share=network
  # A pasta de músicas: ler tags e capas, e gravar as correções que você confirmar.
  - --filesystem=xdg-music
  # Teclas de mídia, Waybar e playerctl.
  - --own-name=org.mpris.MediaPlayer2.ayo_musica
  # Usa o cava, o songrec, o whisper-cpp e o pactl instalados no sistema, quando existirem.
  - --talk-name=org.freedesktop.Flatpak
  # Importa, só para leitura, a biblioteca de uma instalação anterior (Ayo Desk ou fora do Flatpak).
  - --filesystem=~/.local/share/ayo-desk:ro
  - --filesystem=~/.cache/ayo-desk/covers:ro
  - --filesystem=~/.local/share/ayo-musica:ro
  - --filesystem=~/.cache/ayo-musica/covers:ro
cleanup:
  - /include
  - /lib/pkgconfig
  - "*.a"
modules:
  - name: python3-mutagen
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-build-isolation --find-links="file://${PWD}" --prefix="${FLATPAK_DEST}" mutagen
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/47/d8/a29e4e3991765e7ce4ed1f7e4074fe1ba9da03e0048639734de60f9cadb9/mutagen-1.48.1-py3-none-any.whl
        sha256: 4f077fe87d3fc7fba259aa63d8c026b18382ca6a42ef37c61e16f1b1b5b82fe7

  - name: ayo-musica
    buildsystem: simple
    build-commands:
      - python3 scripts/install.py --prefix="${FLATPAK_DEST}"
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - .flatpak-builder
          - .git
          - android
