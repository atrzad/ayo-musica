name: flatpak

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: ayo-musica.flatpak
          manifest-path: packaging/flatpak/io.github.atrzad.AyoMusica.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Ayo Música $GITHUB_REF_NAME" --notes "Veja o CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" ayo-musica.flatpak --clobber
